<!-- app/spa-loading-template.html -->

<!--
  Shown inside the page shell while a client-rendered route starts up — in practice /chat, which
  is also where the installed app opens. Those pages carry no server-rendered markup, so without
  this the browser has nothing to paint until the app has downloaded and mounted.

  Everything is inline: this runs before any stylesheet or component is available.
-->
<div class="afronet-splash" role="status" aria-live="polite">
  <svg width="56" height="56" viewBox="0 0 32 32" fill="none" aria-hidden="true">
    <rect width="32" height="32" rx="9" fill="#0b5d3e" />
    <circle cx="16" cy="16" r="3.4" fill="#ffffff" />
    <circle cx="16" cy="6.5" r="2" fill="#b07f15" />
    <circle cx="24.5" cy="21.5" r="2" fill="#ffffff" opacity="0.85" />
    <circle cx="7.5" cy="21.5" r="2" fill="#ffffff" opacity="0.85" />
    <path
      d="M16 8.5v4.2M18.6 17.8l4 2.4M13.4 17.8l-4 2.4"
      stroke="#ffffff"
      stroke-width="1.4"
      stroke-linecap="round"
      opacity="0.9"
    />
  </svg>
  <p class="afronet-splash__text">Starting Afronet…</p>
</div>

<style>
  .afronet-splash {
    display: flex;
    min-height: 100dvh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #ffffff;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    /* Held back briefly: on a fast machine the app mounts first and nothing flashes. */
    animation: afronet-splash-in 240ms ease-out 180ms both;
  }

  .afronet-splash__text {
    margin: 0;
    font-size: 13px;
    color: #606863;
  }

  @keyframes afronet-splash-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .afronet-splash { animation: none; }
  }
</style>
