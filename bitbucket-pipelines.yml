image: atlassian/default-image:4

definitions:
  services:
    docker:
      memory: 3072

pipelines:
  pull-requests:
    '**':
      - step:
          name: Build check
          services: [docker]
          caches: [docker]
          script:
            - docker build -t afronet-live:test .

  branches:
    master:
      - step:
          name: Build and push to ECR
          services: [docker]
          caches: [docker]
          script:
            - docker build -t afroecr/afronintel/afronet-live:$BITBUCKET_COMMIT .
            - pipe: atlassian/aws-ecr-push-image:2.4.0   # check the pipe's page for the latest version
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: eu-north-1
                IMAGE_NAME: afroecr/afronintel/afronet-live
                TAGS: $BITBUCKET_COMMIT latest

      - step:
          name: Deploy to Kubernetes
          deployment: production
          image: alpine/k8s:1.32.0
          script:
            - git clone --depth=1 https://x-token-auth:${DEPLOY_REPO_TOKEN}@bitbucket.org/${BITBUCKET_WORKSPACE}/deploymentv2.git
            - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region eu-north-1
            - export FILE=frontend/live/afronet/app/frontnuxtjs-deployment.yaml
            - cd deploymentv2
            - sed -i "s|\(image: .*afronet-live\):.*|\1:${BITBUCKET_COMMIT}|" $FILE
            - kubectl apply -n $K8S_NAMESPACE -f $FILE
            - kubectl rollout status deployment/afronet -n $K8S_NAMESPACE --timeout=300s
            # record the deployed tag in the deploymentv2 repo
            - git config user.name "Bitbucket Pipelines"
            - git config user.email "pipelines@noreply.bitbucket.org"
            - |
              if git diff --quiet; then
                echo "No manifest change to commit"
              else
                git add $FILE
                git commit -m "Deploy afronet-live ${BITBUCKET_COMMIT} [skip ci]"
                for i in 1 2 3; do
                  git push origin HEAD && break
                  git pull --rebase origin HEAD
                done
              fi